name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: 1
  RUSTFLAGS: "--cap-lints warn"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: true

      - name: Build release
        run: cargo build --release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: coreutils-x64
          path: target/release/coreutils.exe
          compression-level: 0

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes 2>&1 | Out-Null

      - name: Build installer
        shell: pwsh
        run: |
          $ver = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' `
            | ForEach-Object { $_.Matches.Groups[1].Value.Trim() }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$ver `
            /DArchitecturesAllowed=x64os `
            /DSource=$pwd\target\release\coreutils.exe `
            /O. `
            /Fcoreutils-Titor-Z `
            coreutils.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: coreutils-installer-x64
          path: coreutils-Titor-Z.exe
          compression-level: 0
