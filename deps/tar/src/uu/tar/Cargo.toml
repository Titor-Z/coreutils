[package]
name = "uu_tar"
version = "0.0.1"
edition = "2021"
authors = ["uutils developers"]
license = "MIT"
description = "tar ~ (uutils) an archiving utility"

homepage = "https://github.com/uutils/tar"
repository = "https://github.com/uutils/tar/tree/main/src/uu/tar"
keywords = ["acl", "uutils", "cross-platform", "cli", "utility"]
categories = ["command-line-utilities"]


[dependencies]
uucore = { version = "0.9.0", features = ["fs"] }
clap = { version = "4.4", features = ["wrap_help", "cargo"] }
regex = "1.10.4"
tar = "0.4"
chrono = { version = "0.4.37", default-features = false, features = ["clock"] }
thiserror = "2.0.3"

[lib]
path = "src/tar.rs"

[[bin]]
name = "tar"
path = "src/main.rs"
